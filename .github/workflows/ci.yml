name: Java CI

on:
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build
      run: mvn -B verify
